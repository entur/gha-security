name: Entur/Security/CI

on:
    pull_request:

jobs:
    actionlint:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - name: Check workflow files
          run: |
            echo "::add-matcher::.github/actionlint-matcher.json"
            # pin v1.7.10 using hash
            bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/452672a2ffc7ed15b25ae7931226e9105a9ad61c/scripts/download-actionlint.bash)
            ./actionlint -color
          shell: bash
    update-code-scan-doc:
        uses: entur/gha-meta/.github/workflows/auto-doc.yml@v1.9.0
        with: 
            workflow_file: .github/workflows/code-scan.yml
            readme_file: README-code-scan.md

    update-docker-scan-doc:
        uses: entur/gha-meta/.github/workflows/auto-doc.yml@v1.9.0
        with: 
            workflow_file: .github/workflows/docker-scan.yml
            readme_file: README-docker-scan.md
    biome-check:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - name: Setup Biome
              uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
              with:
                working-dir: ./scanner-action
            - name: Run Biome
              working-directory: ./scanner-action
              run: biome ci