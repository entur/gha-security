name: Entur/Security/CI

on:
    pull_request:

jobs:
    actionlint:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7.0.1
        - name: Check workflow files
          run: |
            echo "::add-matcher::.github/actionlint-matcher.json"
            # pin v1.7.10 using hash
            bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/452672a2ffc7ed15b25ae7931226e9105a9ad61c/scripts/download-actionlint.bash)
            ./actionlint -color
          shell: bash
    update-code-scan-doc:
        uses: entur/gha-meta/.github/workflows/auto-doc.yml@v1.9.1
        with: 
            workflow_file: .github/workflows/code-scan.yml
            readme_file: README-code-scan.md

    update-docker-scan-doc:
        uses: entur/gha-meta/.github/workflows/auto-doc.yml@v1.9.1
        with: 
            workflow_file: .github/workflows/docker-scan.yml
            readme_file: README-docker-scan.md
    lockfile-check:
      runs-on: ubuntu-24.04
      permissions:
        contents: read
      steps:
          - name: Checkout
            uses: actions/checkout@v7.0.1
            with:
              persist-credentials: false
          - name: Verify actions.lock
            env:
              GH_TOKEN: ${{ github.token }}
              GH_ACTIONS_LOCK_VERSJON: v0.4.1
            run: |
              gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSJON"
              gh actions-lock --verify --no-interactive
    biome-check:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1
              with:
                persist-credentials: false
            - name: Setup Biome
              uses: biomejs/setup-biome@v2.7.1
              with:
                working-dir: ./scanner-action
            - name: Run Biome
              working-directory: ./scanner-action
              run: biome ci