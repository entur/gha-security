name: "Entur/Security/Build Scanner Action"
on:
  pull_request:
    paths:
      - 'scanner-action/**'
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  
    build-dist:
      runs-on: ubuntu-24.04
      if: github.event.pull_request.head.repo.full_name == github.repository
      permissions:
        contents: read
      outputs:
        changed: ${{ steps.check.outputs.changed }}
      defaults:
        run:
          working-directory: scanner-action
      steps:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              ref: ${{ github.event.pull_request.head.sha }}
              persist-credentials: false
          - name: Set up Node.js
            uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
            with:
              node-version: 24
          - run: corepack enable
          - run: yarn install --immutable
          - run: yarn build
          - name: Check for dist changes
            id: check
            run: |
              if [ -n "$(git status --porcelain -- dist)" ]; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
              else
                echo "dist is up to date"
                echo "changed=false" >> "$GITHUB_OUTPUT"
              fi
          - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            if: steps.check.outputs.changed == 'true'
            with:
              name: scanner-action-dist
              path: scanner-action/dist
              if-no-files-found: error
              retention-days: 1
    commit-dist:
      needs: [build-dist]
      runs-on: ubuntu-24.04
      if: >-
        needs.build-dist.outputs.changed == 'true' &&
        github.event.pull_request.head.repo.full_name == github.repository
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            ref: ${{ github.event.pull_request.head.sha }}
            persist-credentials: true
        - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
          with:
            name: scanner-action-dist
            path: scanner-action/dist
        - name: Commit dist
          env:
            HEAD_REF: ${{ github.head_ref }}
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scanner-action/dist
            if git diff --cached --quiet; then
              echo "dist is up to date"
              exit 0
            fi
            git commit -m "chore: build scanner-action dist"
            git push origin "HEAD:refs/heads/${HEAD_REF}"

    error-forked-pr:
      needs: [build-dist]
      runs-on: ubuntu-24.04
      if: >-
        needs.build-dist.outputs.changed == 'true' &&
        github.event.pull_request.head.repo.full_name != github.repository
      steps:
        - name: "error"
          run: |
            echo "::error::scanner-action/dist is out of date. Run 'cd scanner-action && yarn && yarn build' and commit the result."
            exit 1